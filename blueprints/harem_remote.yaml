blueprint:
  name: "HARem: Universal ESPHome Remote Controller"
  description: "Handles navigation, device toggling, and multi-line display logic for the HARem remote."
  domain: automation
  input:
    menu_path:
      name: Menu Path Helper
      description: "input_text to store current location (ROOT or Area Name)"
      selector:
        entity:
          domain: input_text
    menu_index:
      name: Menu Index Helper
      description: "input_number to store scroll position"
      selector:
        entity:
          domain: input_number
    menu_total:
      name: Menu Total Helper (Optional)
      description: "input_number to store total items. Required for the main screen scrollbar."
      default: none
      selector:
        entity:
          domain: input_number
    line_1:
      name: Line 1 Helper
      selector:
        entity:
          domain: input_text
    line_2:
      name: Line 2 Helper
      selector:
        entity:
          domain: input_text
    line_3:
      name: Line 3 Helper (Selected)
      selector:
        entity:
          domain: input_text
    line_3_status:
      name: Line 3 Status Helper
      selector:
        entity:
          domain: input_text
    line_4:
      name: Line 4 Helper
      selector:
        entity:
          domain: input_text
    line_5:
      name: Line 5 Helper
      selector:
        entity:
          domain: input_text
    overlay:
      name: Overlay Helper
      selector:
        entity:
          domain: input_text
    guest_mode_switch:
      name: Guest Mode Switch
      description: "input_boolean to track Guest Mode"
      default: none
      selector:
        entity:
          domain: input_boolean
    guest_included_entities:
      name: "[Guest Mode] Allowed Entities"
      description: "Select ALL entities that should be visible in Guest Mode. The areas containing these entities will be automatically allowed."
      default: []
      selector:
        entity:
          multiple: true
    bulk_included_entities:
      name: "[Bulk Control] Included Entities"
      description: "Select ALL entities that should be affected by bulk room power control (press and twist on a room in ROOT menu)."
      default: []
      selector:
        entity:
          multiple: true

  

mode: restart

trigger:
  - platform: event
    event_type: esphome.remote_action

action:
  # 1. HANDLE ACTION
  - variables:
      action: "{{ trigger.event.data.action }}"
      path_entity: !input menu_path
      idx_entity: !input menu_index
      path: "{{ states(path_entity) }}" 
      idx: "{{ states(idx_entity) | int }}"
      guest_switch_entity: !input guest_mode_switch
      guest_ents_raw: !input guest_included_entities
      bulk_ents_raw: !input bulk_included_entities
      
  - variables:
      guest_ents: >
        {% if guest_ents_raw is string %}
          {{ [guest_ents_raw] }}
        {% else %}
          {{ guest_ents_raw }}
        {% endif %}
      bulk_ents: >
        {% if bulk_ents_raw is string %}
          {{ [bulk_ents_raw] }}
        {% else %}
          {{ bulk_ents_raw }}
        {% endif %}
      list_size: >
        {% set gm = guest_switch_entity %}
        {% set is_guest = is_state(gm, 'on') if gm != 'none' else false %}
        {% if path == 'ROOT' or path == '' %}
          {% if is_guest %}
             {% set ns = namespace(areas=[]) %}
             {% for ent in guest_ents %}
               {% set a = area_id(ent) %}
               {% if a != none and a not in ns.areas %}
                 {% set ns.areas = ns.areas + [a] %}
               {% endif %}
             {% endfor %}
             {{ ns.areas | length }}
          {% else %}
             {{ areas() | length }}
          {% endif %}
        {% else %}
          {% set raw_entities = area_entities(path) | reject('is_hidden_entity') | list %}
          {% set p1 = raw_entities | select('match', '^(light|media_player|cover|fan|lock)[.]') | sort | list %}
          {% set p2 = raw_entities | select('match', '^switch[.]') | sort | list %}
          {% set p3 = raw_entities | select('match', '^(button|input_boolean|scene|script)[.]') | sort | list %}
          {% set base = p1 + p2 + p3 %}
          {% if is_guest %}
            {% set base = base | select('in', guest_ents) | list %}
          {% endif %}
          {% set ns = namespace(final=[], names=[]) %}
          {% for ent in base %}
            {% set name = state_attr(ent, 'friendly_name') or ent.split('.')[1] %}
            {% if name not in ns.names %}
              {% set dev = device_id(ent) %}
              {% set keep = namespace(ok=true) %}
              {% if dev != none %}
                {% set ent_dom = ent.split('.')[0] %}
                {% for prev in ns.final %}
                  {% if device_id(prev) == dev %}
                    {% set prev_dom = prev.split('.')[0] %}
                    {% set ent_pri = 1 if ent_dom in ['light', 'media_player', 'cover', 'fan', 'lock'] else (2 if ent_dom == 'switch' else 3) %}
                    {% set prev_pri = 1 if prev_dom in ['light', 'media_player', 'cover', 'fan', 'lock'] else (2 if prev_dom in ['switch'] else 3) %}
                    {% if prev_pri < ent_pri %}
                      {% set keep.ok = false %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% endif %}
              {% if keep.ok %}
                {% set ns.final = ns.final + [ent] %}
                {% set ns.names = ns.names + [name] %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.final | length }}
        {% endif %}

  - choose:
      # ROTATE -> Change Index
      - conditions: "{{ action == 'next' and list_size > 0 }}"
        sequence:
          - service: input_text.set_value
            target: {entity_id: !input overlay}
            data: {value: ""}
          - service: input_number.set_value
            target: {entity_id: !input menu_index}
            data: {value: "{{ (idx + 1) % list_size }}"}
            
      - conditions: "{{ action == 'prev' and list_size > 0 }}"
        sequence:
          - service: input_text.set_value
            target: {entity_id: !input overlay}
            data: {value: ""}
          - service: input_number.set_value
            target: {entity_id: !input menu_index}
            data: {value: "{{ (idx - 1) % list_size }}"}

      # NEW: Handle toggle_guest from remote settings
      - conditions: "{{ action == 'toggle_guest' }}"
        sequence:
          - service: input_boolean.toggle
            target: {entity_id: !input guest_mode_switch}
          # Force nav back to ROOT to avoid being stuck in a restricted room
          - service: input_text.set_value
            target: {entity_id: !input menu_path}
            data: {value: "ROOT"}
          - service: input_number.set_value
            target: {entity_id: !input menu_index}
            data: {value: 0}
          - variables:
              new_state: "{{ 'ON' if is_state(guest_switch_entity, 'on') else 'OFF' }}"
          - service: input_text.set_value
            target: {entity_id: !input overlay}
            data: {value: "Guest Mode: {{ new_state }}"}
          - delay: "00:00:02"
          - service: input_text.set_value
            target: {entity_id: !input overlay}
            data: {value: ""}

      # REFRESH -> Explicitly Redraw Screen
      - conditions: "{{ action == 'refresh' }}"
        sequence:
          - service: input_text.set_value
            target: {entity_id: !input overlay}
            data: {value: ""}
          # The automation will now continue to the "UPDATE DISPLAY" section below

      # CLICK -> Enter/Toggle, Confirm Bulk Action, or Dismiss Active Feedback Overlay
      - conditions: "{{ action == 'click' and list_size > 0 }}"
        sequence:
          - variables:
              ov_entity: !input overlay
              current_ov: "{{ states(ov_entity) }}"

          - choose:
              # 1. CONFIRM BULK TURN ON (when prompt active on ROOT)
              - conditions: "{{ (path == 'ROOT' or path == '') and current_ov == 'Turn ON Room?' }}"
                sequence:
                  - variables:
                      gm: "{{ guest_switch_entity }}"
                      is_guest: "{{ is_state(gm, 'on') if gm != 'none' else false }}"
                      areas_list: >
                        {% if is_guest %}
                           {% set ns = namespace(areas=[]) %}
                           {% for ent in guest_ents %}
                             {% set a = area_id(ent) %}
                             {% if a != none and a not in ns.areas %}
                               {% set ns.areas = ns.areas + [a] %}
                             {% endif %}
                           {% endfor %}
                           {{ ns.areas | sort | to_json }}
                        {% else %}
                           {{ areas() | sort | to_json }}
                        {% endif %}
                      selected_area: "{{ areas_list[idx % areas_list | length] if (areas_list is defined and areas_list | length > 0) else '' }}"
                      selected_area_name: "{{ area_name(selected_area) or selected_area }}"
                      raw_area_ents: "{{ area_entities(selected_area) | reject('is_hidden_entity') | list if selected_area != '' else [] }}"
                      target_bulk_ents: >
                        {% set allowed = raw_area_ents | select('in', bulk_ents) | list %}
                        {% if is_guest %}
                          {% set allowed = allowed | select('in', guest_ents) | list %}
                        {% endif %}
                        {{ allowed | join(',') }}
                  - choose:
                      - conditions: "{{ target_bulk_ents != '' }}"
                        sequence:
                          - service: input_text.set_value
                            target: {entity_id: !input overlay}
                            data: {value: "{{ selected_area_name }} ON"}
                          - service: homeassistant.turn_on
                            target: {entity_id: "{{ target_bulk_ents.split(',') }}"}
                            continue_on_error: true
                    default:
                      - service: input_text.set_value
                        target: {entity_id: !input overlay}
                        data: {value: "No Bulk Devices"}
                  - delay: "00:00:01.5"
                  - service: input_text.set_value
                    target: {entity_id: !input overlay}
                    data: {value: ""}

              # 2. CONFIRM BULK TURN OFF (when prompt active on ROOT)
              - conditions: "{{ (path == 'ROOT' or path == '') and current_ov == 'Turn OFF Room?' }}"
                sequence:
                  - variables:
                      gm: "{{ guest_switch_entity }}"
                      is_guest: "{{ is_state(gm, 'on') if gm != 'none' else false }}"
                      areas_list: >
                        {% if is_guest %}
                           {% set ns = namespace(areas=[]) %}
                           {% for ent in guest_ents %}
                             {% set a = area_id(ent) %}
                             {% if a != none and a not in ns.areas %}
                               {% set ns.areas = ns.areas + [a] %}
                             {% endif %}
                           {% endfor %}
                           {{ ns.areas | sort | to_json }}
                        {% else %}
                           {{ areas() | sort | to_json }}
                        {% endif %}
                      selected_area: "{{ areas_list[idx % areas_list | length] if (areas_list is defined and areas_list | length > 0) else '' }}"
                      selected_area_name: "{{ area_name(selected_area) or selected_area }}"
                      raw_area_ents: "{{ area_entities(selected_area) | reject('is_hidden_entity') | list if selected_area != '' else [] }}"
                      target_bulk_ents: >
                        {% set allowed = raw_area_ents | select('in', bulk_ents) | list %}
                        {% if is_guest %}
                          {% set allowed = allowed | select('in', guest_ents) | list %}
                        {% endif %}
                        {{ allowed | join(',') }}
                  - choose:
                      - conditions: "{{ target_bulk_ents != '' }}"
                        sequence:
                          - service: input_text.set_value
                            target: {entity_id: !input overlay}
                            data: {value: "{{ selected_area_name }} OFF"}
                          - service: homeassistant.turn_off
                            target: {entity_id: "{{ target_bulk_ents.split(',') }}"}
                            continue_on_error: true
                    default:
                      - service: input_text.set_value
                        target: {entity_id: !input overlay}
                        data: {value: "No Bulk Devices"}
                  - delay: "00:00:01.5"
                  - service: input_text.set_value
                    target: {entity_id: !input overlay}
                    data: {value: ""}

              # 3. DISMISS ACTIVE FEEDBACK OVERLAY (If any non-prompt overlay is currently active)
              - conditions: "{{ current_ov != '' and current_ov != ' ' }}"
                sequence:
                  - service: input_text.set_value
                    target: {entity_id: !input overlay}
                    data: {value: ""}

            # 4. NORMAL CLICK (No overlay active)
            default:
              - if: "{{ path == 'ROOT' or path == '' }}"
                then:
                  - variables:
                      gm: "{{ guest_switch_entity }}"
                      is_guest: "{{ is_state(gm, 'on') if gm != 'none' else false }}"
                      areas_list: >
                        {% if is_guest %}
                           {% set ns = namespace(areas=[]) %}
                           {% for ent in guest_ents %}
                             {% set a = area_id(ent) %}
                             {% if a != none and a not in ns.areas %}
                               {% set ns.areas = ns.areas + [a] %}
                             {% endif %}
                           {% endfor %}
                           {{ ns.areas | sort | to_json }}
                        {% else %}
                           {{ areas() | sort | to_json }}
                        {% endif %}
                      selected_area: "{{ areas_list[idx % areas_list | length] if (areas_list is defined and areas_list | length > 0) else '' }}"
                  - service: input_text.set_value
                    target: {entity_id: !input menu_path}
                    data: {value: "{{ selected_area }}"}
                  - service: input_number.set_value
                    target: {entity_id: !input menu_index}
                    data: {value: 0}
                else:
                  - variables:
                      gm: "{{ guest_switch_entity }}"
                      is_guest: "{{ is_state(gm, 'on') if gm != 'none' else false }}"
                      entities: >
                        {% set raw_entities = area_entities(path) | reject('is_hidden_entity') | list %}
                        {% set p1 = raw_entities | select('match', '^(light|media_player|cover|fan|lock)[.]') | sort | list %}
                        {% set p2 = raw_entities | select('match', '^switch[.]') | sort | list %}
                        {% set p3 = raw_entities | select('match', '^(button|input_boolean|scene|script)[.]') | sort | list %}
                        {% set base = p1 + p2 + p3 %}
                        {% if is_guest %}
                          {% set base = base | select('in', guest_ents) | list %}
                        {% endif %}
                        {% set ns = namespace(final=[], names=[]) %}
                        {% for ent in base %}
                          {% set name = state_attr(ent, 'friendly_name') or ent.split('.')[1] %}
                          {% if name not in ns.names %}
                            {% set dev = device_id(ent) %}
                            {% set keep = namespace(ok=true) %}
                            {% if dev != none %}
                              {% set ent_dom = ent.split('.')[0] %}
                              {% for prev in ns.final %}
                                {% if device_id(prev) == dev %}
                                  {% set prev_dom = prev.split('.')[0] %}
                                  {% set ent_pri = 1 if ent_dom in ['light', 'media_player', 'cover', 'fan', 'lock'] else (2 if ent_dom == 'switch' else 3) %}
                                  {% set prev_pri = 1 if prev_dom in ['light', 'media_player', 'cover', 'fan', 'lock'] else (2 if prev_dom in ['switch'] else 3) %}
                                  {% if prev_pri < ent_pri %}
                                    {% set keep.ok = false %}
                                  {% endif %}
                                {% endif %}
                              {% endfor %}
                            {% endif %}
                            {% if keep.ok %}
                              {% set ns.final = ns.final + [ent] %}
                              {% set ns.names = ns.names + [name] %}
                            {% endif %}
                          {% endif %}
                        {% endfor %}
                        {{ ns.final | to_json }}
                      selected_entity: "{{ entities[idx % entities | length] }}"
                      friendly: "{{ state_attr(selected_entity, 'friendly_name') }}"
                      current_state: "{{ states(selected_entity) }}"
                      is_instant: "{{ selected_entity.split('.')[0] in ['scene', 'script', 'button'] }}"
                      new_message: >
                         {% if current_state == 'on' %} Turning Off...
                         {% elif current_state == 'off' %} Turning On...
                         {% else %} Activating... {% endif %}

                  # 1. Show Feedback Logic (Overlay)
                  - service: input_text.set_value
                    target: {entity_id: !input overlay}
                    data: {value: "{{ new_message }}"}

                  # 2. Perform Action
                  - choose:
                      - conditions: "{{ current_state == 'on' or current_state == 'playing' }}"
                        sequence:
                          - service: homeassistant.turn_off
                            target: {entity_id: "{{ selected_entity }}"}
                            continue_on_error: true
                    default:
                      - service: homeassistant.turn_on
                        target: {entity_id: "{{ selected_entity }}"}
                        continue_on_error: true

                  # 3. Wait for State Change (skipped for instant entities)
                  - if: "{{ not is_instant }}"
                    then:
                      - wait_template: "{{ states(selected_entity) != current_state }}"
                        timeout: "00:00:05"
                      - if: "{{ not wait.completed }}"
                        then:
                          - service: input_text.set_value
                            target: {entity_id: !input overlay}
                            data: {value: "Failed!"}
                          - delay: "00:00:02"
                    else:
                      - delay: "00:00:01"

                  # 4. Clear Overlay
                  - service: input_text.set_value
                    target: {entity_id: !input overlay}
                    data: {value: ""}

      # ROTATE HOLD ON ROOM -> Ask Confirmation for Bulk Room Power Control
      - conditions: "{{ (action == 'rotate_cw_hold' or action == 'rotate_ccw_hold') and (path == 'ROOT' or path == '') }}"
        sequence:
          - variables:
              gm: "{{ guest_switch_entity }}"
              is_guest: "{{ is_state(gm, 'on') if gm != 'none' else false }}"
              areas_list: >
                {% if is_guest %}
                   {% set ns = namespace(areas=[]) %}
                   {% for ent in guest_ents %}
                     {% set a = area_id(ent) %}
                     {% if a != none and a not in ns.areas %}
                       {% set ns.areas = ns.areas + [a] %}
                     {% endif %}
                   {% endfor %}
                   {{ ns.areas | sort | to_json }}
                {% else %}
                   {{ areas() | sort | to_json }}
                {% endif %}
              target_area: "{{ areas_list[idx % areas_list | length] if (areas_list is defined and areas_list | length > 0) else '' }}"
              raw_area_ents: "{{ area_entities(target_area) | reject('is_hidden_entity') | list if target_area != '' else [] }}"
              target_bulk_ents: >
                {% set allowed = raw_area_ents | select('in', bulk_ents) | list %}
                {% if is_guest %}
                  {% set allowed = allowed | select('in', guest_ents) | list %}
                {% endif %}
                {{ allowed | join(',') }}
              is_on: "{{ action == 'rotate_cw_hold' }}"
              ov_entity: !input overlay

          - choose:
              - conditions: "{{ target_bulk_ents != '' }}"
                sequence:
                  - service: input_text.set_value
                    target: {entity_id: !input overlay}
                    data:
                      value: >-
                        {% if is_on %}Turn ON Room?{% else %}Turn OFF Room?{% endif %}
                  - delay: "00:00:05"
                  - if: "{{ is_state(ov_entity, 'Turn ON Room?') or is_state(ov_entity, 'Turn OFF Room?') }}"
                    then:
                      - service: input_text.set_value
                        target: {entity_id: !input overlay}
                        data: {value: ""}
            default:
              - service: input_text.set_value
                target: {entity_id: !input overlay}
                data:
                  value: "No Bulk Devices"
              - delay: "00:00:01.5"
              - service: input_text.set_value
                target: {entity_id: !input overlay}
                data: {value: ""}

      # ROTATE HOLD -> Brightness / Volume Control
      - conditions: "{{ (action == 'rotate_cw_hold' or action == 'rotate_ccw_hold') and path != 'ROOT' and path != '' }}"
        sequence:
          - variables:
              start_idx: "{{ states(idx_entity) | int }}"
              gm: "{{ guest_switch_entity }}"
              is_guest: "{{ is_state(gm, 'on') if gm != 'none' else false }}"
              entities: >
                {% set raw_entities = area_entities(path) | reject('is_hidden_entity') | list %}
                {% set p1 = raw_entities | select('match', '^(light|media_player|cover|fan|lock)[.]') | sort | list %}
                {% set p2 = raw_entities | select('match', '^switch[.]') | sort | list %}
                {% set p3 = raw_entities | select('match', '^(button|input_boolean|scene|script)[.]') | sort | list %}
                {% set base = p1 + p2 + p3 %}
                {% if is_guest %}
                  {% set base = base | select('in', guest_ents) | list %}
                {% endif %}
                {% set ns = namespace(final=[], names=[]) %}
                {% for ent in base %}
                  {% set name = state_attr(ent, 'friendly_name') or ent.split('.')[1] %}
                  {% if name not in ns.names %}
                    {% set dev = device_id(ent) %}
                    {% set keep = namespace(ok=true) %}
                    {% if dev != none %}
                      {% set ent_dom = ent.split('.')[0] %}
                      {% for prev in ns.final %}
                        {% if device_id(prev) == dev %}
                          {% set prev_dom = prev.split('.')[0] %}
                          {% set ent_pri = 1 if ent_dom in ['light', 'media_player', 'cover', 'fan', 'lock'] else (2 if ent_dom == 'switch' else 3) %}
                          {% set prev_pri = 1 if prev_dom in ['light', 'media_player', 'cover', 'fan', 'lock'] else (2 if prev_dom in ['switch'] else 3) %}
                          {% if prev_pri < ent_pri %}
                            {% set keep.ok = false %}
                          {% endif %}
                        {% endif %}
                      {% endfor %}
                    {% endif %}
                    {% if keep.ok %}
                      {% set ns.final = ns.final + [ent] %}
                      {% set ns.names = ns.names + [name] %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {{ ns.final | to_json }}
              selected_entity: "{{ entities[start_idx % entities | length] }}"
              domain: "{{ selected_entity.split('.')[0] }}"
              step: "{{ 10 if action == 'rotate_cw_hold' else -10 }}"
              grid: "{{ step | int | abs }}"
              line_3_status_ent: !input line_3_status
              current_pct: >
                 {% set val = states(line_3_status_ent) %}
                 {% set is_off = val.startswith('(off)') %}
                 {% set numbers = val | regex_findall('\\((\\d+)%\\)') %}
                 {% set stored = 0 if is_off else (numbers[0] | int(-1) if (numbers is defined and numbers | length > 0) else -1) %}
                 {% if stored >= 0 %}
                   {{ stored }}
                 {% elif domain == 'light' %}
                   {% set raw_pct = (state_attr(selected_entity, 'brightness') | int(0) / 2.55) %}
                   {{ ((raw_pct / grid) | round(0) * grid) | int }}
                 {% elif domain == 'media_player' %}
                   {% set raw_pct = state_attr(selected_entity, 'volume_level') | float(0) * 100 %}
                   {{ ((raw_pct / grid) | round(0) * grid) | int }}
                 {% else %} 0 {% endif %}
              new_pct: >-
                 {% set val = (current_pct | float) + (step | int) %}
                 {% set clamped = 100 if val > 100 else (0 if val < 0 else val) %}
                 {{ clamped | int }}
              
          - choose:
              # LIGHTS
              - conditions: "{{ domain == 'light' }}"
                sequence:
                  - service: input_text.set_value
                    target: { entity_id: !input overlay }
                    data:
                      value: >
                        {% if new_pct | int >= 100 %}MAX 100%{% elif new_pct | int <= 0 %}MIN 0%{% else %}Bright {{ new_pct | int }}%{% endif %}
                  - service: input_text.set_value
                    target: { entity_id: !input line_3_status }
                    data:
                      value: "{% if new_pct | int <= 0 %}(off) *{% else %}({{ new_pct | int }}%) *{% endif %}"
                  - delay: "00:00:00.250"
                  - choose:
                      - conditions: "{{ new_pct | int <= 0 }}"
                        sequence:
                          - service: light.turn_off
                            target: { entity_id: "{{ selected_entity }}" }
                            continue_on_error: true
                    default:
                      - service: light.turn_on
                        target: { entity_id: "{{ selected_entity }}" }
                        data: >
                          {% set base = dict(brightness=((new_pct | float) * 2.55) | round(0) | int) %}
                          {% set ct = state_attr(selected_entity, 'color_temp') %}
                          {% if ct not in [none, 'unknown', ''] %}
                            {% set base = dict(base, color_temp=ct) %}
                          {% endif %}
                          {{ base }}
                        continue_on_error: true
              
              # MEDIA PLAYERS (Volume)
              - conditions: "{{ domain == 'media_player' }}"
                sequence:
                  - service: input_text.set_value
                    target: { entity_id: !input overlay }
                    data:
                      value: >
                        {% if new_pct | int >= 100 %}MAX 100%{% elif new_pct | int <= 0 %}MIN 0%{% else %}Vol {{ new_pct | int }}%{% endif %}
                  - service: input_text.set_value
                    target: { entity_id: !input line_3_status }
                    data:
                      value: "{% if new_pct | int <= 0 %}(off) *{% else %}({{ new_pct | int }}%) *{% endif %}"
                  - delay: "00:00:00.250"
                  - choose:
                      - conditions: "{{ new_pct | int <= 0 }}"
                        sequence:
                          - service: media_player.turn_off
                            target: { entity_id: "{{ selected_entity }}" }
                            continue_on_error: true
                    default:
                      - service: media_player.volume_set
                        target: { entity_id: "{{ selected_entity }}" }
                        data:
                          volume_level: "{{ new_pct | float / 100 }}"
                        continue_on_error: true

          - delay: 0.05
          - delay: "00:00:05"
          - service: input_text.set_value
            target: {entity_id: !input overlay}
            data: {value: ""}

      # BACK -> Exit Room or Clear Active Overlay Prompt
      - conditions: "{{ action == 'back' }}"
        sequence:
          - service: input_text.set_value
            target: {entity_id: !input overlay}
            data: {value: ""}
          - if: "{{ path != 'ROOT' and path != '' }}"
            then:
              - variables:
                  sorted_areas: "{{ areas() | sort }}"
                  restore_idx: "{{ sorted_areas.index(path) if path in sorted_areas else 0 }}"
              - service: input_number.set_value
                target: {entity_id: !input menu_index}
                data: {value: "{{ restore_idx }}"}
              - service: input_text.set_value
                target: {entity_id: !input menu_path}
                data: {value: "ROOT"}

  # 2. UPDATE DISPLAY (skip for rotation — overlay is shown, line_5 is the pct tracker)
  - if: "{{ action not in ['rotate_cw_hold', 'rotate_ccw_hold'] }}"
    then:
      - delay: { milliseconds: 100 }
      - variables:
          path: "{{ states(path_entity) }}" 
          idx: "{{ states(idx_entity) | int }}"
          guest_ents: !input guest_included_entities
          menu_total_ent: !input menu_total
          list_size_val: "{{ list_size }}"
          line_3_status_ent: !input line_3_status

      - if: "{{ menu_total_ent != 'none' }}"
        then:
          - service: input_number.set_value
            target: {entity_id: !input menu_total}
            data: {value: "{{ list_size_val }}"}

      - if: "{{ path == 'ROOT' or path == '' }}"
        then:
          - variables:
              gm: "{{ guest_switch_entity }}"
              is_guest: "{{ is_state(gm, 'on') if gm != 'none' else false }}"
              list: >
                {% if is_guest %}
                   {% set ns = namespace(areas=[]) %}
                   {% for ent in guest_ents %}
                     {% set a = area_id(ent) %}
                     {% if a != none and a not in ns.areas %}
                       {% set ns.areas = ns.areas + [a] %}
                     {% endif %}
                   {% endfor %}
                   {{ ns.areas | sort | to_json }}
                {% else %}
                   {{ areas() | sort | to_json }}
                {% endif %}
          - if: "{{ list | length > 0 }}"
            then:
              - service: input_text.set_value
                target: {entity_id: !input line_1}
                data:
                  value: >-
                    {% if list|length >= 5 %}
                      {{ area_name(list[(idx - 2) % list|length]) or '' }}
                    {% else %}
                      {% set target = idx - 2 %}
                      {% if target >= 0 %}
                        {% for item in list %}
                          {%- if loop.index0 == target -%}
                            {{ area_name(item) or '' }}
                          {%- endif -%}
                        {% endfor %}
                      {% endif %}
                    {% endif %}
              - service: input_text.set_value
                target: {entity_id: !input line_2}
                data:
                  value: >-
                    {% if list|length >= 5 %}
                      {{ area_name(list[(idx - 1) % list|length]) or '' }}
                    {% else %}
                      {% set target = idx - 1 %}
                      {% if target >= 0 %}
                        {% for item in list %}
                          {%- if loop.index0 == target -%}
                            {{ area_name(item) or '' }}
                          {%- endif -%}
                        {% endfor %}
                      {% endif %}
                    {% endif %}
              - service: input_text.set_value
                target: {entity_id: !input line_3}
                data:
                  value: >-
                    {% if list|length >= 5 %}
                      {{ area_name(list[idx % list|length]) or '' }}
                    {% else %}
                      {% for item in list %}
                        {%- if loop.index0 == idx -%}
                          {{ area_name(item) or '' }}
                        {%- endif -%}
                      {% endfor %}
                    {% endif %}
              - service: input_text.set_value
                target: {entity_id: !input line_3_status}
                data: {value: "(room) *"}
              - service: input_text.set_value
                target: {entity_id: !input line_4}
                data:
                  value: >-
                    {% if list|length >= 5 %}
                      {{ area_name(list[(idx + 1) % list|length]) or '' }}
                    {% else %}
                      {% set target = idx + 1 %}
                      {% for item in list %}
                        {%- if loop.index0 == target -%}
                          {{ area_name(item) or '' }}
                        {%- endif -%}
                      {% endfor %}
                    {% endif %}
              - service: input_text.set_value
                target: {entity_id: !input line_5}
                data:
                  value: >-
                    {% if list|length >= 5 %}
                      {{ area_name(list[(idx + 2) % list|length]) or '' }}
                    {% else %}
                      {% set target = idx + 2 %}
                      {% for item in list %}
                        {%- if loop.index0 == target -%}
                          {{ area_name(item) or '' }}
                        {%- endif -%}
                      {% endfor %}
                    {% endif %}
            else:
               - service: input_text.set_value
                 target: {entity_id: !input line_1}
                 data: {value: ""}
               - service: input_text.set_value
                 target: {entity_id: !input line_2}
                 data: {value: ""}
               - service: input_text.set_value
                 target: {entity_id: !input line_3}
                 data: {value: "No Areas Found"}
               - service: input_text.set_value
                 target: {entity_id: !input line_3_status}
                 data: {value: ""}
               - service: input_text.set_value
                 target: {entity_id: !input line_4}
                 data: {value: ""}
               - service: input_text.set_value
                 target: {entity_id: !input line_5}
                 data: {value: ""}

        else:
          - variables:
              gm: "{{ guest_switch_entity }}"
              is_guest: "{{ is_state(gm, 'on') if gm != 'none' else false }}"
              list: >
                {% set raw_entities = area_entities(path) | reject('is_hidden_entity') | list %}
                {% set p1 = raw_entities | select('match', '^(light|media_player|cover|fan|lock)[.]') | sort | list %}
                {% set p2 = raw_entities | select('match', '^switch[.]') | sort | list %}
                {% set p3 = raw_entities | select('match', '^(button|input_boolean|scene|script)[.]') | sort | list %}
                {% set base = p1 + p2 + p3 %}
                {% if is_guest %}
                  {% set base = base | select('in', guest_ents) | list %}
                {% endif %}
                {% set ns = namespace(final=[], names=[]) %}
                {% for ent in base %}
                  {% set name = state_attr(ent, 'friendly_name') or ent.split('.')[1] %}
                  {% if name not in ns.names %}
                    {% set dev = device_id(ent) %}
                    {% set keep = namespace(ok=true) %}
                    {% if dev != none %}
                      {% set ent_dom = ent.split('.')[0] %}
                      {% for prev in ns.final %}
                        {% if device_id(prev) == dev %}
                          {% set prev_dom = prev.split('.')[0] %}
                          {% set ent_pri = 1 if ent_dom in ['light', 'media_player', 'cover', 'fan', 'lock'] else (2 if ent_dom == 'switch' else 3) %}
                          {% set prev_pri = 1 if prev_dom in ['light', 'media_player', 'cover', 'fan', 'lock'] else (2 if prev_dom in ['switch'] else 3) %}
                          {% if prev_pri < ent_pri %}
                            {% set keep.ok = false %}
                          {% endif %}
                        {% endif %}
                      {% endfor %}
                    {% endif %}
                    {% if keep.ok %}
                      {% set ns.final = ns.final + [ent] %}
                      {% set ns.names = ns.names + [name] %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {{ ns.final | to_json }}
          - if: "{{ list | length > 0 }}"
            then:
              - service: input_text.set_value
                target: {entity_id: !input line_1}
                data:
                  value: >-
                    {% if list|length >= 5 %}
                      {% set item = list[(idx - 2) % list|length] %}
                      {{ state_attr(item, 'friendly_name') or (item.split('.')[1] | replace('_', ' ') | title) }}
                    {% else %}
                      {% set target = idx - 2 %}
                      {% if target >= 0 %}
                        {% for item in list %}
                          {%- if loop.index0 == target -%}
                            {{ state_attr(item, 'friendly_name') or (item.split('.')[1] | replace('_', ' ') | title) }}
                          {%- endif -%}
                        {% endfor %}
                      {% endif %}
                    {% endif %}
              - service: input_text.set_value
                target: {entity_id: !input line_2}
                data:
                  value: >-
                    {% if list|length >= 5 %}
                      {% set item = list[(idx - 1) % list|length] %}
                      {{ state_attr(item, 'friendly_name') or (item.split('.')[1] | replace('_', ' ') | title) }}
                    {% else %}
                      {% set target = idx - 1 %}
                      {% if target >= 0 %}
                        {% for item in list %}
                          {%- if loop.index0 == target -%}
                            {{ state_attr(item, 'friendly_name') or (item.split('.')[1] | replace('_', ' ') | title) }}
                          {%- endif -%}
                        {% endfor %}
                      {% endif %}
                    {% endif %}
              - service: input_text.set_value
                target: {entity_id: !input line_3}
                data:
                  value: >-
                    {% if list|length >= 5 %}
                      {% set item = list[idx % list|length] %}
                      {{ state_attr(item, 'friendly_name') or (item.split('.')[1] | replace('_', ' ') | title) }}
                    {% else %}
                      {% for item in list %}
                        {%- if loop.index0 == idx -%}
                          {{ state_attr(item, 'friendly_name') or (item.split('.')[1] | replace('_', ' ') | title) }}
                        {%- endif -%}
                      {% endfor %}
                    {% endif %}
              - service: input_text.set_value
                target: {entity_id: !input line_3_status}
                data:
                  value: >
                    {% set entity = list[idx % list|length] %}
                    {% if entity %}
                      {% set current_status = states(line_3_status_ent) %}
                      {% if action == 'refresh' and current_status != '' and current_status.startswith('(') and not current_status.startswith('(room)') %}
                        {{ current_status }}
                      {% else %}
                        {% set dom = entity.split('.')[0] %}
                        {% set ns = namespace(can_dim=false) %}
                        {% if dom == 'light' %}
                          {# Check for brightness support bit 0x01 (1) #}
                          {% if (state_attr(entity, 'supported_features') | int(0) | bitwise_and(1)) > 0 %}
                            {% set ns.can_dim = true %}
                          {% endif %}
                          {# Check unique color modes #}
                          {% set modes = state_attr(entity, 'supported_color_modes') %}
                          {% if modes %}
                            {% for m in modes %}
                              {% if m != 'onoff' %}
                                 {% set ns.can_dim = true %}
                              {% endif %}
                            {% endfor %}
                          {% endif %}
                        {% elif dom == 'media_player' %}
                           {# Check for volume_set bit 0x04 (4) #}
                           {% if (state_attr(entity, 'supported_features') | int(0) | bitwise_and(4)) > 0 %}
                             {% set ns.can_dim = true %}
                           {% endif %}
                        {% endif %}
                        {% set final_state = states(entity) %}
                        {% if final_state == 'on' or final_state == 'playing' %}
                           {% if dom == 'light' and ns.can_dim and state_attr(entity, 'brightness') != none %}
                              {% set raw = (state_attr(entity, 'brightness') | int(0) / 2.55) %}
                              {% set calc = (((raw / 10) | round(0, 'common')) * 10) | int %}
                              {% set final_state = 'on' if calc <= 0 else (calc | string + '%') %}
                           {% elif dom == 'media_player' and ns.can_dim and state_attr(entity, 'volume_level') != none %}
                              {% set raw = (state_attr(entity, 'volume_level') | float(0) * 100) %}
                              {% set calc = (((raw / 10) | round(0, 'common')) * 10) | int %}
                              {% set final_state = 'playing' if calc <= 0 else (calc | string + '%') %}
                           {% endif %}
                        {% endif %}
                        ({{ final_state | truncate(12, True, '..') }}){{ ' *' if ns.can_dim else '' }}
                      {% endif %}
                    {% endif %}
              - service: input_text.set_value
                target: {entity_id: !input line_4}
                data:
                  value: >-
                    {% if list|length >= 5 %}
                      {% set item = list[(idx + 1) % list|length] %}
                      {{ state_attr(item, 'friendly_name') or (item.split('.')[1] | replace('_', ' ') | title) }}
                    {% else %}
                      {% set target = idx + 1 %}
                      {% for item in list %}
                        {%- if loop.index0 == target -%}
                          {{ state_attr(item, 'friendly_name') or (item.split('.')[1] | replace('_', ' ') | title) }}
                        {%- endif -%}
                      {% endfor %}
                    {% endif %}
              - service: input_text.set_value
                target: {entity_id: !input line_5}
                data:
                  value: >-
                    {% if list|length >= 5 %}
                      {% set item = list[(idx + 2) % list|length] %}
                      {{ state_attr(item, 'friendly_name') or (item.split('.')[1] | replace('_', ' ') | title) }}
                    {% else %}
                      {% set target = idx + 2 %}
                      {% for item in list %}
                        {%- if loop.index0 == target -%}
                          {{ state_attr(item, 'friendly_name') or (item.split('.')[1] | replace('_', ' ') | title) }}
                        {%- endif -%}
                      {% endfor %}
                    {% endif %}
            else:
               - service: input_text.set_value
                 target: {entity_id: !input line_1}
                 data: {value: ""}
               - service: input_text.set_value
                 target: {entity_id: !input line_2}
                 data: {value: ""}
               - service: input_text.set_value
                 target: {entity_id: !input line_3}
                 data: {value: "Empty Room"}
               - service: input_text.set_value
                 target: {entity_id: !input line_3_status}
                 data: {value: ""}
               - service: input_text.set_value
                 target: {entity_id: !input line_4}
                 data: {value: ""}
               - service: input_text.set_value
                 target: {entity_id: !input line_5}
                 data: {value: ""}

