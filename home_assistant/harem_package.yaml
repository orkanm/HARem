# HARem: Home Assistant Remote - One-Click Package
# Drop this file into your 'packages' folder in Home Assistant.
# Ensure you have 'packages: !include_dir_named packages' in your configuration.yaml

input_text:
  harem_menu_path:
    name: "Remote: Menu Path"
    initial: "ROOT"
  harem_line_1:
    name: "Remote: Line 1"
  harem_line_2:
    name: "Remote: Line 2"
  harem_line_3:
    name: "Remote: Line 3"
  harem_line_4:
    name: "Remote: Line 4"
  harem_line_5:
    name: "Remote: Line 5"
  harem_line_3_status:
    name: "Remote: Line 3 Status"
  harem_overlay:
    name: "Remote: Overlay"

input_boolean:
  harem_guest_mode:
    name: "Remote: Guest Mode"
    icon: mdi:account-lock

input_number:
  harem_menu_index:
    name: "Remote: Menu Index"
    min: 0
    max: 1000
    step: 1
    mode: box
  harem_menu_total:
    name: "Remote: Menu Total"
    min: 0
    max: 1000
    step: 1
    mode: box


